<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金锦钰校招投递追踪</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f5f3;
      --text: #17202a;
      --muted: #65717f;
      --line: #d9e0e7;
      --green: #147a5b;
      --blue: #246baf;
      --amber: #9a650c;
      --red: #ad3b3b;
      --shadow: 0 14px 34px rgba(22, 31, 43, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 276px 1fr;
    }

    aside {
      background: #1f2a35;
      color: #f6f8fb;
      padding: 22px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #66c6a5, #4b85c5);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 750;
    }

    .brand p {
      margin: 3px 0 0;
      color: #c9d4df;
      font-size: 12px;
    }

    .side-group {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding-top: 16px;
      margin-top: 16px;
    }

    .side-label {
      color: #9fb0c0;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      color: #e8eef4;
    }

    .stat strong { font-size: 18px; }

    main {
      padding: 24px;
      min-width: 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 170px 170px 170px auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
    }

    input, select {
      height: 38px;
      padding: 0 10px;
    }

    textarea {
      min-height: 74px;
      padding: 8px 10px;
      resize: vertical;
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(36, 107, 175, 0.35);
      outline-offset: 2px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 8px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 4px;
      cursor: grab;
    }

    .tab:active { cursor: grabbing; }

    .tab.dragging {
      opacity: 0.45;
    }

    .tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
      font-weight: 700;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 18px rgba(22, 31, 43, 0.04);
      min-width: 0;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 25px;
      line-height: 1.1;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      align-items: start;
    }

    .column {
      background: #eef2f5;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .column-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #f9fbfc;
      font-weight: 700;
    }

    .cards {
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
      box-shadow: 0 6px 16px rgba(22, 31, 43, 0.05);
    }

    .card.done { border-color: rgba(20, 122, 91, 0.35); background: #fbfffd; }

    .topline {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .check {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--green);
    }

    .company {
      font-size: 15px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .role {
      margin: 4px 0 8px;
      color: #2d3b48;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .pill {
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--panel-soft);
      color: #2d5d50;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .priority-high { background: #fff1d8; color: var(--amber); }
    .priority-sprint { background: #ffe8e8; color: var(--red); }
    .priority-normal { background: #e9f2fb; color: var(--blue); }
    .priority-low { background: #f0edf3; color: #6b5b75; }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .note-row {
      margin-top: 8px;
      display: grid;
      gap: 7px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .pool {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(22, 31, 43, 0.04);
    }

    .pool-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f9fbfc;
    }

    .pool-head strong {
      font-size: 15px;
    }

    .pool-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: max-content;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #fbfcfd;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      position: relative;
      user-select: none;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 2;
    }

    .resize-handle::after {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    th:hover .resize-handle::after {
      background: var(--line);
    }

    td {
      background: #fff;
    }

    td.reason-cell {
      color: #334251;
      max-width: 320px;
    }

    .pool-action,
    .pool-priority,
    .pool-discard,
    .card-discard,
    .discard-restore,
    .discard-select {
      min-width: 96px;
      padding: 0 10px;
    }

    .pool-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pool-segments {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .pool-segment {
      height: 32px;
      padding: 0 12px;
    }

    .pool-segment.active {
      background: #eaf5f0;
      border-color: rgba(20, 122, 91, 0.35);
      color: var(--green);
      font-weight: 700;
    }

    .pool-action.added,
    .pool-priority.added {
      background: #eaf5f0;
      border-color: rgba(20, 122, 91, 0.28);
      color: var(--green);
    }

    .pool-discard,
    .card-discard {
      color: var(--red);
      border-color: rgba(173, 59, 59, 0.28);
      background: #fff4f4;
    }

    .hidden { display: none !important; }

    .empty {
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .brand { margin-bottom: 0; }
      .side-group { margin-top: 0; padding-top: 0; border-top: 0; }
      .toolbar { grid-template-columns: 1fr 1fr 1fr; }
      .board { grid-template-columns: repeat(2, minmax(230px, 1fr)); }
    }

    @media (max-width: 720px) {
      main { padding: 14px; }
      aside { grid-template-columns: 1fr; padding: 18px 14px; }
      .toolbar, .summary, .board { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      .card-actions { grid-template-columns: 1fr; }
      .pool-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

      </div>
    </aside>

    <main>

        <input id="search" type="search" placeholder="搜索公司、岗位、城市、理由">
        <select id="stageFilter" aria-label="阶段筛选"></select>
        <select id="priorityFilter" aria-label="层级筛选">
          <option value="all">全部层级</option>
          <option value="high">高匹配</option>
          <option value="normal">可投备选</option>
          <option value="low">低意向备查</option>
        </select>
        <select id="sortMode" aria-label="排序">
          <option value="updated">按更新时间</option>
          <option value="priority">按匹配优先</option>
          <option value="deadline">按截止时间</option>
        </select>
        <button id="exportBtn" title="导出当前进度 JSON">导出</button>
        <button id="importBtn" class="primary" title="导入之前导出的进度 JSON">导入</button>
      </div>

      <div class="summary">
        <div class="metric"><span>待投递</span><strong id="metricTodo">0</strong></div>
        <div class="metric"><span>已投递</span><strong id="metricApplied">0</strong></div>
        <div class="metric"><span>测评/笔试</span><strong id="metricAssess">0</strong></div>
        <div class="metric"><span>面试中</span><strong id="metricInterview">0</strong></div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" data-view="pool" role="tab">优选池</button>
        <button class="tab active" data-view="board" role="tab">看板</button>
        <button class="tab" data-view="list" role="tab">待动作</button>
        <button class="tab" data-view="focus" role="tab">今日优先</button>
        <button class="tab" data-view="discarded" role="tab">弃池</button>
      </div>

      <section id="poolView" class="pool hidden" aria-label="优选岗位池"></section>
      <section id="boardView" class="board" aria-label="投递阶段看板"></section>
      <section id="listView" class="list hidden" aria-label="待动作岗位"></section>
      <section id="focusView" class="list hidden" aria-label="今日优先岗位"></section>
      <section id="discardedView" class="pool hidden" aria-label="弃池岗位"></section>

      <p class="footer-note">进度自动保存在当前浏览器。每日自动化会把新增匹配岗位写入优选池，刷新后会合并新岗位；只有你标为待动作的岗位才进入看板，并且不会覆盖你已记录的阶段、备注和下一步动作。</p>
    </main>
  </div>

      "投递", "报名", "查看", "点击", "官方公告", "内推", "公众号", "链接", "扫码",
      "免费", "班车", "住宿", "食宿", "三餐", "公寓", "代租", "薪资", "薪酬", "福利",

    ];
    const COMPANY_SPLITTERS = ["，", ",", "｜", "|", "、", "；", ";", "-"];
    const DISCARD_TAG_RULES = [
      { tag: "教育", words: ["教师", "教育", "培训", "学校", "分校", "竞赛教练", "学管", "教研"] },
      { tag: "研发/算法", words: ["算法", "研发", "硬件", "芯片", "嵌入式", "机械", "电气", "工艺", "测试工程师", "程序设计"] },

      { tag: "实习项目", words: ["实习", "Intern", "intern", "暑期", "寒暑假"] },
      { tag: "职能岗", words: ["财务", "法务", "行政", "人力", "HR", "职能"] },
    ];

    function normalizeJob(job) {
      if (!job.stage) job.stage = "todo";
      if (typeof job.company === "string") {
        job.company = job.company.trim().replace(/^[+\-•·]+/, "");
      }
      job.done = job.done === true;
      job.selected = job.selected === true;
      job.discarded = job.discarded === true;
      job.todayPriority = job.todayPriority === true;
      const summerIntern = /暑期实习|寒暑假实习|暑期助理顾问实习生|暑期助理|Summer Intern|Summer Internship|实习生计划/.test(
        `${job.company || ""} ${job.role || ""} ${job.reason || ""}`
      );
      if (summerIntern) return null;
      if (!job.selected || job.discarded || job.done || job.stage !== "todo") {
        job.todayPriority = false;
      }
      return job;
    }

    function normalizeState(nextState) {
      nextState.jobs = Array.isArray(nextState.jobs) ? nextState.jobs.map(normalizeJob).filter(Boolean) : [];
      return nextState;
    }

    function normalizeCompanyName(text) {
      let value = String(text || "").trim().replace(/^[+\-•·]+/, "");
      if (!value) return "";
      for (const splitter of COMPANY_SPLITTERS) {
        if (!value.includes(splitter)) continue;
        const [left, ...restParts] = value.split(splitter);
        const rest = restParts.join(splitter).trim();
        if (left && rest && COMPANY_BAD_MARKERS.some(marker => rest.toLowerCase().includes(marker.toLowerCase()))) {
          value = left.trim();
          break;
        }
      }
      return value;
    }

    function applyDiscardProfile() {
      const jobs = state.jobs || [];
      discardProfile = { companies: new Set(), tags: new Set() };
      jobs.forEach(job => {
        if (!job.discarded) return;
        const company = normalizeCompanyName(job.company || "");
        if (company) discardProfile.companies.add(company.toLowerCase());
        const text = `${job.company || ""} ${job.role || ""} ${job.reason || ""} ${job.notes || ""}`;
        DISCARD_TAG_RULES.forEach(rule => {
          if (rule.words.some(word => text.includes(word))) {
            discardProfile.tags.add(rule.tag);
          }
        });
      });
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const savedJobs = Array.isArray(saved.jobs) ? saved.jobs : [];
      const byId = new Map(savedJobs.map(job => [job.id, job]));
      const merged = SEED_JOBS.map(seed => ({
        stage: "todo",
        done: false,
        notes: "",
        nextAction: "",
        selected: seed.selected === true,
        todayPriority: seed.todayPriority === true,
        discarded: seed.discarded === true,
        updatedAt: seed.sourceDate,
        ...seed,
        ...(byId.get(seed.id) || {})
      }));
      for (const job of savedJobs) {
        if (!merged.some(item => item.id === job.id)) {
          merged.push({
            stage: "todo",
            done: false,
            notes: "",
            nextAction: "",
            selected: job.selected === true,
            todayPriority: job.todayPriority === true,
            discarded: job.discarded === true,
            updatedAt: job.sourceDate || today(),
            ...job
          });
        }
      }
      return normalizeState({ jobs: merged });
    }

    function saveState() {
      normalizeState(state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadColumnWidths() {
      const saved = JSON.parse(localStorage.getItem(COLUMN_WIDTHS_KEY) || "null");
      if (!Array.isArray(saved) || saved.length !== DEFAULT_COLUMN_WIDTHS.length) {
        return DEFAULT_COLUMN_WIDTHS.slice();
      }
      return saved.map((width, index) => Math.max(70, Number(width) || DEFAULT_COLUMN_WIDTHS[index]));
    }

    function saveColumnWidths() {
      localStorage.setItem(COLUMN_WIDTHS_KEY, JSON.stringify(columnWidths));

      return labels.map((label, index) => `

      `).join("");

    function priorityLabel(priority) {
      return { high: "高匹配", sprint: "高匹配/冲刺", normal: "可投备选", low: "低意向备查" }[priority] || "可投备选";
    }

    function priorityMatches(job, priority) {
      if (priority === "all") return true;
      if (priority === "high") return ["high", "sprint"].includes(job.priority);
      return job.priority === priority;
    }

    function stageLabel(stage) {
      return (STAGES.find(item => item.id === stage) || STAGES[0]).label;
    }

    function isInterview(stage) {
      return ["interview1", "interview2", "hr"].includes(stage);
    }

    function parseDeadline(deadline) {
      const text = String(deadline || "").trim();
      const match = text.match(/(20\d{2})[-./年](\d{1,2})[-./月](\d{1,2})/);
      if (!match) return null;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 23, 59, 59, 999);
    }

    function isExpired(job) {
      const deadline = parseDeadline(job.deadline);
      return deadline ? deadline < new Date() : false;
    }

    function isSummerInternship(job) {
      return /暑期实习|寒暑假实习|暑期助理顾问实习生|暑期助理|Summer Intern|Summer Internship|实习生计划/.test(
        `${job.company || ""} ${job.role || ""} ${job.reason || ""}`
      );
    }

    function discardMatched(job) {
      const company = normalizeCompanyName(job.company || "").toLowerCase();
      const text = `${job.company || ""} ${job.role || ""} ${job.reason || ""} ${job.notes || ""}`;
      if (company && discardProfile.companies.has(company)) return true;
      return Array.from(discardProfile.tags).some(tag =>
        (tag === "教育" && /教师|教育|培训|学校|分校|竞赛教练|学管|教研/.test(text)) ||
        (tag === "研发/算法" && /算法|研发|硬件|芯片|嵌入式|机械|电气|工艺|测试工程师|程序设计/.test(text)) ||
        (tag === "金融量化" && /量化|投资|基金|银行|券商|审计|风控|研究员/.test(text)) ||
        (tag === "实习项目" && /实习|Intern|intern|暑期|寒暑假/.test(text)) ||
        (tag === "职能岗" && /财务|法务|行政|人力|HR|职能/.test(text))
      );
    }

    function isPendingAction(job) {
      return job.stage === "todo" && !job.done;
    }

    function isInPool(job) {
      return !isExpired(job) && !isSummerInternship(job) && !discardMatched(job) && !job.discarded && !job.selected && !job.todayPriority;

      const stage = document.querySelector("#stageFilter").value;

        return !isExpired(job) &&
          !isSummerInternship(job) &&
          !job.discarded &&
          (!search || text.includes(search)) &&
          job.selected &&
          (stage === "all" || job.stage === stage) &&

      });

      return sortJobs(jobs, sort);

      const sort = document.querySelector("#sortMode").value;
      let jobs = state.jobs.filter(job => {
        const text = `${job.company} ${job.role} ${job.location} ${job.reason} ${job.notes}`.toLowerCase();
        return !isExpired(job) &&
          !isSummerInternship(job) &&
          job.discarded &&
          (!search || text.includes(search)) &&
          priorityMatches(job, priority);
      });

      return sortJobs(jobs, sort);
    }

    function sortJobs(jobs, sort) {
      jobs = jobs.slice().sort((a, b) => {
        if (sort === "priority") {
          const rank = { high: 0, sprint: 1, normal: 2, low: 3 };
          return (rank[a.priority] ?? 9) - (rank[b.priority] ?? 9) || a.company.localeCompare(b.company, "zh-CN");
        }
        if (sort === "deadline") {
          return (a.deadline || "9999-12-31").localeCompare(b.deadline || "9999-12-31");
        }
        return (b.updatedAt || "").localeCompare(a.updatedAt || "");
      });
      return jobs;
    }

    function renderControls() {
      const stageFilter = document.querySelector("#stageFilter");
      stageFilter.innerHTML = `<option value="all">全部阶段</option>` + STAGES
        .map(stage => `<option value="${stage.id}">${stage.label}</option>`)
        .join("");
    }

    function renderStats() {
      const jobs = state.jobs.filter(job => !isExpired(job) && !isSummerInternship(job));
      const activeJobs = jobs.filter(job => !job.discarded);
      const selectedJobs = jobs.filter(job => job.selected);
      const activeSelectedJobs = activeJobs.filter(job => job.selected);
      document.querySelector("#totalJobs").textContent = activeJobs.length;
      document.querySelector("#actionJobs").textContent = activeSelectedJobs.filter(isPendingAction).length;
      document.querySelector("#discardedJobs").textContent = jobs.filter(job => job.discarded).length;
      document.querySelector("#metricTodo").textContent = activeSelectedJobs.filter(job => job.stage === "todo").length;
      document.querySelector("#metricApplied").textContent = activeSelectedJobs.filter(job => job.stage === "applied").length;
      document.querySelector("#metricAssess").textContent = activeSelectedJobs.filter(job => ["assessment", "written"].includes(job.stage)).length;
      document.querySelector("#metricInterview").textContent = activeSelectedJobs.filter(job => isInterview(job.stage)).length;
    }

    function jobCard(job) {
      const stageOptions = STAGES.map(stage =>
        `<option value="${stage.id}" ${job.stage === stage.id ? "selected" : ""}>${stage.label}</option>`
      ).join("");
      const canPrioritizeToday = job.stage === "todo" && !job.done;
      return `
        <article class="card ${job.done ? "done" : ""}" data-id="${job.id}">
          <div class="topline">
            <input class="check" type="checkbox" ${job.done ? "checked" : ""} aria-label="标记投递完成">
            <div>
              <div class="company">${escapeHtml(job.company)}</div>
              <div class="role">${escapeHtml(job.role)}</div>
            </div>
          </div>
          <div class="meta">
            <span class="pill priority-${job.priority}">${priorityLabel(job.priority)}</span>
            <span class="pill">${escapeHtml(job.location || "地点待确认")}</span>
            <span class="pill">${stageLabel(job.stage)}</span>
            ${job.todayPriority ? `<span class="pill">今日优先</span>` : ""}
            ${job.deadline ? `<span class="pill">截止 ${escapeHtml(job.deadline)}</span>` : ""}
          </div>
          <div>${escapeHtml(job.reason)}</div>
          <div class="card-actions">
            <select class="stage-select" aria-label="更新进度">${stageOptions}</select>
            <button class="today-toggle" type="button" ${canPrioritizeToday ? "" : "disabled"}>${canPrioritizeToday ? (job.todayPriority ? "取消今日优先" : "今日优先") : "已跟进"}</button>
            <button class="card-discard" type="button">放入弃池</button>
            <a href="${job.url}" target="_blank" rel="noreferrer"><button type="button">打开投递</button></a>
          </div>
          <div class="note-row">
            <input class="next-action" value="${escapeAttr(job.nextAction || "")}" placeholder="下一步：测评截止/面试时间">
            <textarea class="notes" placeholder="备注：账号、内推码、HR、反馈">${escapeHtml(job.notes || "")}</textarea>
          </div>
        </article>
      `;
    }

    function renderBoard(jobs) {
      const boardStages = ["todo", "applied", "assessment", "interview1", "rejected", "withdrawn"];
      const board = document.querySelector("#boardView");
      board.innerHTML = boardStages.map(stageId => {
        const stageJobs = jobs.filter(job => {
          if (stageId === "assessment") return ["assessment", "written"].includes(job.stage);
          if (stageId === "interview1") return isInterview(job.stage) || job.stage === "offer";
          return job.stage === stageId;
        });
        return `
          <div class="column">
            <div class="column-head"><span>${stageId === "interview1" ? "面试/Offer" : stageLabel(stageId)}</span><span>${stageJobs.length}</span></div>
            <div class="cards">${stageJobs.length ? stageJobs.map(jobCard).join("") : `<div class="empty">暂无岗位</div>`}</div>
          </div>
        `;
      }).join("");
    }

    function renderList(jobs, target) {
      document.querySelector(target).innerHTML = jobs.length ? jobs.map(jobCard).join("") : `<div class="empty">没有符合当前筛选的岗位</div>`;
    }

    function poolRow(job) {
      return `
        <tr data-id="${job.id}">
          <td>
            <strong>${escapeHtml(job.company)}</strong>
            <div class="meta">
              <span class="pill priority-${job.priority}">${priorityLabel(job.priority)}</span>
              <span class="pill">优选池</span>
            </div>
          </td>
          <td>${escapeHtml(job.role)}</td>
          <td>${escapeHtml(job.location || "待确认")}</td>
          <td>${escapeHtml(job.deadline || "未标注")}</td>
          <td class="reason-cell">${escapeHtml(job.reason)}</td>
          <td><a href="${job.url}" target="_blank" rel="noreferrer">打开</a></td>
          <td>
            <div class="pool-buttons">
              <button class="pool-action" type="button">
                待动作
              </button>
              <button class="pool-priority" type="button">
                今日优先
              </button>
              <button class="pool-discard" type="button">放入弃池</button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderPool(jobs) {
      const visibleJobs = state.jobs.filter(isInPool);
      const highCount = visibleJobs.filter(job => ["high", "sprint"].includes(job.priority)).length;
      const backupCount = visibleJobs.filter(job => job.priority === "normal").length;
      const lowCount = visibleJobs.filter(job => job.priority === "low").length;
      const activeJobs = state.jobs.filter(job => !isExpired(job) && !job.discarded);
      const actionCount = activeJobs.filter(job => job.selected).length;
      const pool = document.querySelector("#poolView");
      pool.innerHTML = `
        <div class="pool-head">
          <div>
            <strong>优选岗位表格</strong>
            <span>从 ${visibleJobs.length} 个匹配岗位里选择要跟进的目标：高匹配 ${highCount} / 可投备选 ${backupCount} / 低意向备查 ${lowCount}</span>
          </div>
          <span>已移出优选池 ${actionCount}</span>
        </div>
        <div class="table-wrap">
          <div class="pool-segments" aria-label="优选池类型筛选">
            <button class="pool-segment ${activePoolTier === "all" ? "active" : ""}" type="button" data-tier="all">全部 ${visibleJobs.length}</button>
            <button class="pool-segment ${activePoolTier === "high" ? "active" : ""}" type="button" data-tier="high">高匹配 ${highCount}</button>
            <button class="pool-segment ${activePoolTier === "normal" ? "active" : ""}" type="button" data-tier="normal">可投备选 ${backupCount}</button>
            <button class="pool-segment ${activePoolTier === "low" ? "active" : ""}" type="button" data-tier="low">低意向备查 ${lowCount}</button>
          </div>
          <table>
            ${renderColGroup()}
            <thead>
              <tr>
                ${tableHeader()}
              </tr>
            </thead>
            <tbody>
              ${jobs.length ? jobs.map(poolRow).join("") : `<tr><td colspan="7"><div class="empty">没有符合当前筛选的岗位</div></td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    }

    function discardedRow(job) {
      return `
        <tr data-id="${job.id}">
          <td>
            <strong>${escapeHtml(job.company)}</strong>
            <div class="meta">
              <span class="pill priority-${job.priority}">${priorityLabel(job.priority)}</span>
              <span class="pill">弃池</span>
            </div>
          </td>
          <td>${escapeHtml(job.role)}</td>
          <td>${escapeHtml(job.location || "待确认")}</td>
          <td>${escapeHtml(job.deadline || "未标注")}</td>
          <td class="reason-cell">${escapeHtml(job.reason)}</td>
          <td><a href="${job.url}" target="_blank" rel="noreferrer">打开</a></td>
          <td>
            <div class="pool-buttons">
              <button class="discard-restore" type="button">移回优选池</button>
              <button class="discard-select" type="button">待动作</button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderDiscarded(jobs) {
      const discarded = state.jobs.filter(job => !isExpired(job) && job.discarded);
      const panel = document.querySelector("#discardedView");
      panel.innerHTML = `
        <div class="pool-head">
          <div>
            <strong>弃池</strong>
            <span>${discarded.length} 个暂不合适岗位，可最后复查补投</span>
          </div>
          <span>可移回优选池或标为待动作</span>
        </div>
        <div class="table-wrap">
          <table>
            ${renderColGroup()}
            <thead>
              <tr>
                ${tableHeader()}
              </tr>
            </thead>
            <tbody>
              ${jobs.length ? jobs.map(discardedRow).join("") : `<tr><td colspan="7"><div class="empty">弃池没有符合当前筛选的岗位</div></td></tr>`}
            </tbody>
          </table>
        </div>
      `;
    }

    function render() {
      applyDiscardProfile();
      const jobs = filteredJobs();
      const actionJobs = jobs.filter(isPendingAction);
      const poolJobs = filteredPoolJobs();
      const discardedJobs = filteredDiscardedJobs();
      renderStats();
      renderPool(poolJobs);
      renderDiscarded(discardedJobs);
      renderBoard(jobs);
      renderList(actionJobs, "#listView");
      const focusJobs = actionJobs.filter(job => job.todayPriority).slice(0, 12);
      renderList(focusJobs, "#focusView");
      bindPoolRows();
      bindPoolSegments();
      bindDiscardedRows();
      bindColumnResizers();
      bindCards();
    }

    function bindColumnResizers() {
      document.querySelectorAll(".resize-handle").forEach(handle => {
        handle.addEventListener("pointerdown", event => {
          event.preventDefault();
          const index = Number(handle.dataset.col);
          const startX = event.clientX;
          const startWidth = columnWidths[index];
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";

          function onMove(moveEvent) {
            const nextWidth = Math.max(70, startWidth + moveEvent.clientX - startX);
            columnWidths[index] = nextWidth;
            document.querySelectorAll(`col:nth-child(${index + 1})`).forEach(col => {
              col.style.width = `${nextWidth}px`;
            });
          }

          function onUp() {
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            saveColumnWidths();
          }

          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp);
        });
      });
    }

    function bindPoolSegments() {
      document.querySelectorAll(".pool-segment").forEach(button => {
        button.addEventListener("click", () => {
          activePoolTier = button.dataset.tier;
          render();
        });
      });
    }

    function bindPoolRows() {
      document.querySelectorAll(".pool-action").forEach(button => {
        button.addEventListener("click", event => {
          const row = event.target.closest("tr");
          const job = state.jobs.find(item => item.id === row.dataset.id);
          job.selected = true;
          if (job.selected && !job.stage) job.stage = "todo";
          if (job.selected && ["rejected", "withdrawn"].includes(job.stage)) job.stage = "todo";
          job.updatedAt = today();
          saveState();
          render();
        });
      });
      document.querySelectorAll(".pool-priority").forEach(button => {
        button.addEventListener("click", event => {
          const row = event.target.closest("tr");
          const job = state.jobs.find(item => item.id === row.dataset.id);
          job.selected = true;
          job.todayPriority = true;
          if (!job.stage || ["rejected", "withdrawn"].includes(job.stage)) job.stage = "todo";
          job.updatedAt = today();
          saveState();
          render();
        });
      });
      document.querySelectorAll(".pool-discard").forEach(button => {
        button.addEventListener("click", event => {
          const row = event.target.closest("tr");
          const job = state.jobs.find(item => item.id === row.dataset.id);
          job.discarded = true;
          job.selected = false;
          job.todayPriority = false;
          job.updatedAt = today();
          saveState();
          render();
        });
      });
    }

    function bindDiscardedRows() {
      document.querySelectorAll(".discard-restore").forEach(button => {
        button.addEventListener("click", event => {
          const row = event.target.closest("tr");
          const job = state.jobs.find(item => item.id === row.dataset.id);
          job.discarded = false;
          job.updatedAt = today();
          saveState();
          render();
        });
      });
      document.querySelectorAll(".discard-select").forEach(button => {
        button.addEventListener("click", event => {
          const row = event.target.closest("tr");
          const job = state.jobs.find(item => item.id === row.dataset.id);
          job.discarded = false;
          job.selected = true;
          job.todayPriority = false;
          if (!job.stage || ["rejected", "withdrawn"].includes(job.stage)) job.stage = "todo";
          job.updatedAt = today();
          saveState();
          render();
        });
      });
    }

    function bindCards() {
      document.querySelectorAll(".card").forEach(card => {
        const id = card.dataset.id;
        const job = state.jobs.find(item => item.id === id);
        card.querySelector(".check").addEventListener("change", event => {
          job.done = event.target.checked;
          if (job.done && job.stage === "todo") job.stage = "applied";
          if (job.done || job.stage !== "todo") job.todayPriority = false;
          job.updatedAt = today();
          saveState();
          render();
        });
        card.querySelector(".stage-select").addEventListener("change", event => {
          job.stage = event.target.value;
          job.done = job.stage !== "todo";
          if (job.stage !== "todo") job.todayPriority = false;
          job.updatedAt = today();
          saveState();
          render();
        });
        card.querySelector(".today-toggle").addEventListener("click", () => {
          if (job.stage !== "todo" || job.done) {
            job.todayPriority = false;
            saveState();
            render();
            return;
          }
          job.todayPriority = !job.todayPriority;
          job.updatedAt = today();
          saveState();
          render();
        });
        card.querySelector(".card-discard").addEventListener("click", () => {
          job.discarded = true;
          job.selected = false;
          job.todayPriority = false;
          job.updatedAt = today();
          saveState();
          render();
        });
        card.querySelector(".next-action").addEventListener("input", event => {
          job.nextAction = event.target.value;
          job.updatedAt = today();
          saveState();
        });
        card.querySelector(".notes").addEventListener("input", event => {
          job.notes = event.target.value;
          job.updatedAt = today();
          saveState();
        });
      });
    }

    function setView(view) {
      activeView = view;
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.view === view));
      document.querySelector("#poolView").classList.toggle("hidden", view !== "pool");
      document.querySelector("#boardView").classList.toggle("hidden", view !== "board");
      document.querySelector("#listView").classList.toggle("hidden", view !== "list");
      document.querySelector("#focusView").classList.toggle("hidden", view !== "focus");
      document.querySelector("#discardedView").classList.toggle("hidden", view !== "discarded");
    }

    function loadTabOrder() {
      const saved = JSON.parse(localStorage.getItem(TAB_ORDER_KEY) || "null");
      if (!Array.isArray(saved)) return DEFAULT_TAB_ORDER.slice();
      const valid = saved.filter(view => DEFAULT_TAB_ORDER.includes(view));
      const missing = DEFAULT_TAB_ORDER.filter(view => !valid.includes(view));
      return valid.concat(missing);
    }

    function saveTabOrder() {
      const order = Array.from(document.querySelectorAll(".tab")).map(tab => tab.dataset.view);
      localStorage.setItem(TAB_ORDER_KEY, JSON.stringify(order));
    }

    function applyTabOrder() {
      const tabs = document.querySelector(".tabs");
      const byView = new Map(Array.from(tabs.querySelectorAll(".tab")).map(tab => [tab.dataset.view, tab]));
      loadTabOrder().forEach(view => {
        const tab = byView.get(view);
        if (tab) tabs.appendChild(tab);
      });
    }

    function bindTabs() {
      const tabs = document.querySelector(".tabs");
      let draggedTab = null;
      tabs.querySelectorAll(".tab").forEach(tab => {
        tab.draggable = true;
        tab.addEventListener("click", () => setView(tab.dataset.view));
        tab.addEventListener("dragstart", event => {
          draggedTab = tab;
          tab.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", tab.dataset.view);
        });
        tab.addEventListener("dragend", () => {
          tab.classList.remove("dragging");
          draggedTab = null;
          saveTabOrder();
        });
      });
      tabs.addEventListener("dragover", event => {
        event.preventDefault();
        const target = event.target.closest(".tab");
        if (!draggedTab || !target || target === draggedTab) return;
        const rect = target.getBoundingClientRect();
        const afterTarget = event.clientX > rect.left + rect.width / 2;
        tabs.insertBefore(draggedTab, afterTarget ? target.nextSibling : target);
      });
      tabs.addEventListener("drop", event => {
        event.preventDefault();
        saveTabOrder();
      });
    }

    function exportState() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `job-tracker-${today()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importState(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported.jobs)) throw new Error("Invalid tracker file");
        state = normalizeState(imported);
        saveState();
        render();
      };
      reader.readAsText(file);
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    renderControls();
    applyTabOrder();
    bindTabs();
    saveState();
    render();

    ["search", "stageFilter", "priorityFilter", "sortMode"].forEach(id => {
      document.querySelector(`#${id}`).addEventListener("input", render);
    });
    document.querySelector("#exportBtn").addEventListener("click", exportState);
    document.querySelector("#importBtn").addEventListener("click", () => document.querySelector("#importFile").click());
    document.querySelector("#importFile").addEventListener("change", event => {
      if (event.target.files[0]) importState(event.target.files[0]);
    });
  </script>
</body>
</html>
